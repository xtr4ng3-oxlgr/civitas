name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build core-rust
        working-directory: core-rust
        run: cargo build --verbose

  python-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile check ui-python
        run: python -m py_compile $(git ls-files 'ui-python/*.py')
